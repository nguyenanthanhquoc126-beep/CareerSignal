version: '3.8'

networks:
    data-lakehouse:
        driver: bridge

services:
    minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        container_name: minio
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: nguyenanthanhquoc
            MINIO_ROOT_PASSWORD: Thanhquoc123
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio-data:/data
        restart: unless-stopped
        networks:
            - data-lakehouse

    nessie-init:
        image: alpine:3.22
        container_name: nessie-init
        entrypoint:
            - /bin/sh
            - -c
            - |
                chown -R 10000:10001 /data
                chmod -R 775 /data
        volumes:
            - nessie-data:/data
        restart: "no"
        networks:
            - data-lakehouse

    nessie:
        image: ghcr.io/projectnessie/nessie:0.108.3
        container_name: nessie
        depends_on:
            nessie-init:
                condition: service_completed_successfully
        environment:
            NESSIE_VERSION_STORE_TYPE: ROCKSDB
            NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /var/lib/nessie
        ports:
            - "19120:19120"
        volumes:
            - nessie-data:/var/lib/nessie
        restart: unless-stopped
        networks:
            - data-lakehouse

    spark-master:
        build:
            context: ./spark-jobs/docker
            dockerfile: Dockerfile
        image: career-signal-spark-master:3.5.9
        container_name: spark-master
        command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
        ports:
            - "7077:7077"
            - "8080:8080"
        networks:
            - data-lakehouse
        volumes:
            - ./spark-jobs:/opt/spark-jobs
        environment:
            MINIO_USER: ${MINIO_USER}
            MINIO_PASSWORD: ${MINIO_PASSWORD}

    spark-worker:
        build:
            context: ./spark-jobs/docker
            dockerfile: Dockerfile
        image: career-signal-spark-worker:3.5.9
        container_name: spark-worker
        command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077
        environment:
            SPARK_WORKER_CORES: 2
            SPARK_WORKER_MEMORY: 2G
        depends_on:
            - spark-master
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - data-lakehouse

    trino-coordinator:
        image: trinodb/trino:483
        container_name: trino-coordinator
        ports:
            - "8085:8080"
        environment:
            MINIO_USER: ${MINIO_USER}
            MINIO_PASSWORD: ${MINIO_PASSWORD}
        volumes:
            - ./trino/condinator/configCondinator.properties:/etc/trino/config.properties:ro
            - ./trino/condinator/Node.properties:/etc/trino/node.properties:ro
            - ./trino/catalog/nessie.properties:/etc/trino/catalog/nessie.properties:ro
        networks:
            - data-lakehouse
        depends_on:
            - minio
            - nessie
        restart: unless-stopped

    trino-worker-1:
        image: trinodb/trino:483
        container_name: trino-worker-1
        environment:
            MINIO_USER: ${MINIO_USER}
            MINIO_PASSWORD: ${MINIO_PASSWORD}
        volumes:
            - ./trino/Worker/config.properties:/etc/trino/config.properties:ro
            - ./trino/Worker/NodeWorker1.properties:/etc/trino/node.properties:ro
            - ./trino/catalog/nessie.properties:/etc/trino/catalog/nessie.properties:ro
        networks:
            - data-lakehouse
        depends_on:
            - trino-coordinator
        restart: unless-stopped

    trino-worker-2:
        image: trinodb/trino:483
        container_name: trino-worker-2
        environment:
            MINIO_USER: ${MINIO_USER}
            MINIO_PASSWORD: ${MINIO_PASSWORD}
        volumes:
            - ./trino/Worker/config.properties:/etc/trino/config.properties:ro
            - ./trino/Worker/NodeWorker2.properties:/etc/trino/node.properties:ro
            - ./trino/catalog/nessie.properties:/etc/trino/catalog/nessie.properties:ro
        networks:
            - data-lakehouse
        depends_on:
            - trino-coordinator
        restart: unless-stopped

volumes:
    minio-data:
    nessie-data: