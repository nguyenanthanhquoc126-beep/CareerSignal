version: '3.8'

x-airflow-common:
    &airflow-common
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.1-python3.11}
    environment:
        &airflow-common-env
        AIRFLOW__CORE__EXECUTOR: CeleryExecutor
        AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
        AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
        AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
        AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_CELERY_WORKER_CONCURRENCY:-2}
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
        AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Bangkok
        AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-2}
        AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-2}
        AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
        AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-change-this-local-api-secret}
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-this-local-jwt-secret}
        AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
        AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
        AIRFLOW_CONN_PIPELINE_SERVER: >-
          {"conn_type":"ssh","host":"${WSL_SSH_HOST}","login":"${WSL_SSH_USER}","password":"${WSL_SSH_PASSWORD}","port":22}
        CAREER_SIGNAL_ROOT: ${CAREER_SIGNAL_ROOT}    
    volumes:
        - ./orchestration/dags:/opt/airflow/dags:ro
        - ./orchestration/plugins:/opt/airflow/plugins:ro
        - ./orchestration/config:/opt/airflow/config
        - ./orchestration/logs:/opt/airflow/logs

    user: "${AIRFLOW_UID:-50000}:0"

    networks:
        - data-lakehouse

    depends_on:
        airflow-postgres:
            condition: service_healthy
        redis:
            condition: service_healthy


networks:
    data-lakehouse:
        driver: bridge


services:

    minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        container_name: minio
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio-data:/data
        restart: unless-stopped
        networks:
            - data-lakehouse


    nessie-init:
        image: alpine:3.22
        container_name: nessie-init
        entrypoint:
            - /bin/sh
            - -c
            - |
                chown -R 10000:10001 /data
                chmod -R 775 /data
        volumes:
            - nessie-data:/data
        restart: "no"
        networks:
            - data-lakehouse


    nessie:
        image: ghcr.io/projectnessie/nessie:0.108.3
        container_name: nessie
        depends_on:
            nessie-init:
                condition: service_completed_successfully
        environment:
            NESSIE_VERSION_STORE_TYPE: ROCKSDB
            NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /var/lib/nessie
        ports:
            - "19120:19120"
        volumes:
            - nessie-data:/var/lib/nessie
        restart: unless-stopped
        networks:
            - data-lakehouse


    spark-master:
        build:
            context: ./spark-jobs/docker
            dockerfile: Dockerfile
        image: career-signal-spark-master:3.5.9
        container_name: spark-master
        command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
        ports:
            - "7077:7077"
            - "8080:8080"
        networks:
            - data-lakehouse
        volumes:
            - ./spark-jobs:/opt/spark-jobs
            - ./logging_config.py:/opt/logging_config.py:ro
            - ./pipeline_upload.log:/opt/pipeline_upload.log:rw
        environment:
            MINIO_USER: ${MINIO_ROOT_USER}
            MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
            PYTHONPATH: /opt
    spark-worker:
        build:
            context: ./spark-jobs/docker
            dockerfile: Dockerfile
        image: career-signal-spark-worker:3.5.9
        container_name: spark-worker
        command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077
        environment:
            SPARK_WORKER_CORES: 2
            SPARK_WORKER_MEMORY: 2G
            PYTHONPATH: /opt
        volumes:
            - ./logging_config.py:/opt/logging_config.py:ro
            - ./pipeline_upload.log:/opt/pipeline_upload.log:rw
        depends_on:
            - spark-master
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - data-lakehouse


    trino-coordinator:
        image: trinodb/trino:483
        container_name: trino-coordinator
        ports:
            - "8085:8080"
        environment:
            MINIO_USER: ${MINIO_ROOT_USER}
            MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
        volumes:
            - ./trino/condinator/configCondinator.properties:/etc/trino/config.properties:ro
            - ./trino/condinator/Node.properties:/etc/trino/node.properties:ro
            - ./trino/catalog/nessie.properties:/etc/trino/catalog/nessie.properties:ro
        networks:
            - data-lakehouse
        depends_on:
            - minio
            - nessie
        restart: unless-stopped


    trino-worker-1:
        image: trinodb/trino:483
        container_name: trino-worker-1
        environment:
            MINIO_USER: ${MINIO_ROOT_USER}
            MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
        volumes:
            - ./trino/Worker/config.properties:/etc/trino/config.properties:ro
            - ./trino/Worker/NodeWorker1.properties:/etc/trino/node.properties:ro
            - ./trino/catalog/nessie.properties:/etc/trino/catalog/nessie.properties:ro
        networks:
            - data-lakehouse
        depends_on:
            - trino-coordinator
        restart: unless-stopped


    trino-worker-2:
        image: trinodb/trino:483
        container_name: trino-worker-2
        environment:
            MINIO_USER: ${MINIO_ROOT_USER}
            MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
        volumes:
            - ./trino/Worker/config.properties:/etc/trino/config.properties:ro
            - ./trino/Worker/NodeWorker2.properties:/etc/trino/node.properties:ro
            - ./trino/catalog/nessie.properties:/etc/trino/catalog/nessie.properties:ro
        networks:
            - data-lakehouse
        depends_on:
            - trino-coordinator
        restart: unless-stopped


    redis:
        image: redis:7.2-bookworm
        expose:
            - "6379"
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        networks:
            - data-lakehouse

    airflow-postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
            POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
            POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
        volumes:
            - airflow-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        networks:
            - data-lakehouse


    airflow-init:
        <<: *airflow-common
        command:
            - bash
            - -c
            - |
                airflow config list >/dev/null
                airflow version
        environment:
            <<: *airflow-common-env
            _AIRFLOW_DB_MIGRATE: "true"
            _AIRFLOW_WWW_USER_CREATE: "true"
            _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
            _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
        restart: "no"


    airflow-apiserver:
        <<: *airflow-common
        command: api-server
        ports:
            - "8081:8080"
        healthcheck:
            test:
                - CMD
                - curl
                - --fail
                - http://localhost:8080/api/v2/monitor/health
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        depends_on:
            airflow-postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            airflow-init:
                condition: service_completed_successfully
        restart: unless-stopped


    airflow-scheduler:
        <<: *airflow-common
        command: scheduler
        healthcheck:
            test:
                - CMD-SHELL
                - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        depends_on:
            airflow-postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            airflow-init:
                condition: service_completed_successfully
            airflow-apiserver:
                condition: service_healthy
        restart: unless-stopped


    airflow-dag-processor:
        <<: *airflow-common
        command: dag-processor
        healthcheck:
            test:
                - CMD-SHELL
                - airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        depends_on:
            airflow-postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            airflow-init:
                condition: service_completed_successfully
        restart: unless-stopped


    airflow-worker:
        <<: *airflow-common
        command: celery worker
        healthcheck:
            test:
                - CMD-SHELL
                - celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        environment:
            <<: *airflow-common-env
            DUMB_INIT_SETSID: "0"
        depends_on:
            airflow-postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            airflow-init:
                condition: service_completed_successfully
            airflow-apiserver:
                condition: service_healthy
        restart: unless-stopped


    airflow-triggerer:
        <<: *airflow-common
        command: triggerer
        healthcheck:
            test:
                - CMD-SHELL
                - airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        depends_on:
            airflow-postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            airflow-init:
                condition: service_completed_successfully
        restart: unless-stopped


volumes:
    minio-data:
    nessie-data:
    airflow-postgres-data:
